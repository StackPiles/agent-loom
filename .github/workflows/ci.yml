name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node 24 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  chrome-smoke:
    name: Real Chrome / Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify preinstalled browser and virtual display
        run: |
          google-chrome --version
          command -v xvfb-run
      - name: Exercise real Chrome with its sandbox enabled
        run: timeout --signal=TERM --kill-after=15s 180s xvfb-run --auto-servernum --server-args="-screen 0 1440x1000x24" node scripts/browser-smoke.mjs

  container:
    name: Container build and health
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build image
        run: docker build --tag agent-loom:ci .
      - name: Start container
        run: docker run --detach --name loom-ci --env LOOM_API_TOKEN=ci-disposable-health-test-token --publish 127.0.0.1:3210:3210 agent-loom:ci
      - name: Check health
        # Docker may reset connections before the application starts listening.
        run: curl --fail --retry 15 --retry-delay 1 --retry-connrefused --retry-all-errors --connect-timeout 2 --max-time 5 --retry-max-time 45 http://127.0.0.1:3210/api/health
      - name: Show container logs on failure
        if: failure()
        run: docker logs loom-ci
      - name: Remove test container
        if: always()
        run: docker rm --force --volumes loom-ci
