name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node 24 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  chrome-smoke:
    name: Real Chrome / Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify preinstalled browser and virtual display
        run: |
          google-chrome --version
          command -v xvfb-run
      - name: Install pinned Japanese fonts for UI screenshots
        timeout-minutes: 3
        run: |
          # Noto Sans CJK 2.004 from the official repository. Avoid depending on
          # Ubuntu mirror availability before the actual browser checks start.
          loom_ci_font_commit=f8d157532fbfaeda587e826d4cd5b21a49186f7c
          loom_ci_font_dir="$HOME/.local/share/fonts/loom-ci-noto"
          mkdir -p "$loom_ci_font_dir"
          for loom_ci_font_style in Regular Bold; do
            case "$loom_ci_font_style" in
              Regular) loom_ci_font_blob=f56224957fb13a81b4c14bac34f2f058a017f9fb ;;
              Bold) loom_ci_font_blob=d006db30aee377d6d8b5bb15375ef068f403f213 ;;
            esac
            loom_ci_font_name="NotoSansCJKjp-${loom_ci_font_style}.otf"
            loom_ci_font_path="$RUNNER_TEMP/$loom_ci_font_name"
            curl --fail --location --retry 2 --connect-timeout 10 --max-time 60 \
              "https://raw.githubusercontent.com/notofonts/noto-cjk/$loom_ci_font_commit/Sans/OTF/Japanese/$loom_ci_font_name" \
              --output "$loom_ci_font_path"
            test "$(git hash-object "$loom_ci_font_path")" = "$loom_ci_font_blob"
            install -m 644 "$loom_ci_font_path" "$loom_ci_font_dir/$loom_ci_font_name"
          done
          fc-cache -f "$loom_ci_font_dir"
          for loom_ci_font_style in Regular Bold; do
            loom_ci_font_match=$(fc-match --format='%{file}' "sans-serif:lang=ja:weight=${loom_ci_font_style,,}")
            test "$loom_ci_font_match" = "$loom_ci_font_dir/NotoSansCJKjp-${loom_ci_font_style}.otf"
          done
          fc-match --format='%{family}\n' 'sans-serif:lang=ja'
      - name: Exercise real Chrome with its sandbox enabled
        run: timeout --signal=TERM --kill-after=15s 180s xvfb-run --auto-servernum --server-args="-screen 0 1440x1000x24" node scripts/browser-smoke.mjs
      - name: Verify responsive chat in real Chrome
        env:
          LOOM_UI_ARTIFACT_DIR: ${{ runner.temp }}/loom-chat-ui
          LOOM_CHROME_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: timeout --signal=TERM --kill-after=15s 120s node scripts/chat-ui-smoke.mjs
      - name: Upload chat UI screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chat-ui-screenshots
          path: ${{ runner.temp }}/loom-chat-ui
          if-no-files-found: warn
          retention-days: 7

  container:
    name: Container build and health
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build image
        run: docker build --tag agent-loom:ci .
      - name: Start container
        run: docker run --detach --name loom-ci --env LOOM_API_TOKEN=ci-disposable-health-test-token --publish 127.0.0.1:3210:3210 agent-loom:ci
      - name: Check health
        # Docker may reset connections before the application starts listening.
        run: curl --fail --retry 15 --retry-delay 1 --retry-connrefused --retry-all-errors --connect-timeout 2 --max-time 5 --retry-max-time 45 http://127.0.0.1:3210/api/health
      - name: Show container logs on failure
        if: failure()
        run: docker logs loom-ci
      - name: Remove test container
        if: always()
        run: docker rm --force --volumes loom-ci
